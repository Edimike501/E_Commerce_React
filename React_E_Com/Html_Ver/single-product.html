<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./CssAsset/icofont/icofont.min.css" />
    <link rel="stylesheet" href="./CssAsset/font-awe/css/all.min.css" />
    <link rel="stylesheet" href="./CssAsset/single-product.css" />
  </head>
  <body>
    <div class="product-det-hold">
      <div class="product-det-cont">
        <div class="head">
          <a href="product.html">
            <i class="fa-solid fa-arrow-left-long"></i>
          </a>
          <div class="logo">Your Logo</div>
          <a href="home.html">
            <i class="icofont-doutone icofont-cart cart">
              <p class="flex-it">20</p>
            </i>
          </a>
        </div>
        <div class="product-details">
          <div
            class="img-cont"
            style="background-image: url('./Media/shoe1.png')"
          >
            <div class="small-imgs">
              <div
                class="small-img"
                style="background-image: url('./Media/shoe1.png')"
              ></div>
              <div
                class="small-img"
                style="background-image: url('./Media/shoe1.png')"
              ></div>
              <div
                class="small-img"
                style="background-image: url('./Media/shoe1.png')"
              ></div>
            </div>
          </div>
          <div class="details">
            <h1 class="title">nike air jordan iv</h1>
            <p class="price">$100</p>
            <p class="description">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla
              aspernatur cupiditate ad numquam ipsa magnam quaerat nihil
              architecto asperiores non.
            </p>
            <div class="quantity">
              <div class="text">
                <p>QUANTITY :</p>
                <p class="value">10</p>
              </div>
              <div class="icon">
                <i class="icofont-minus"></i>
                <i class="icofont-plus"></i>
              </div>
            </div>
            <button class="add-to-cart-btn">ADD TO CART</button>
            <div class="share">
              <p>share this model</p>
              <div class="icon">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-google-plus-g"></i>
                <i class="fa-brands fa-instagram"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
